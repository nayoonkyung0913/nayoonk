    var duration = animation.effect.getTiming().duration;
    animation.currentTime = ((animation.currentTime || 0) + direction * duration / galleryCards.length + duration) % duration;
  });
});
root.addEventListener('click',function(e){var a=e.target.closest('a[href^="#kz-"]');if(!a)return;var t=root.querySelector(a.getAttribute('href'));if(t){e.preventDefault();t.scrollIntoView({behavior:paused?'auto':'smooth',block:'start'});}});
if('IntersectionObserver'in window){var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){if(!paused)e.target.classList.add('enter');ob.unobserve(e.target);}});},{threshold:.15});root.querySelectorAll('.ingredient,.process-grid article,.recipe-card').forEach(function(e){ob.observe(e);});}
}
function start() {
  var root = document.getElementById('kz-v3');
  if (!root) return false;
  if (root.dataset.ready) return true;
  var galleryGroup = root.querySelector('.gallery-belt > .gallery-group');
  var flavorCount = root.querySelectorAll('[data-flavor]').length;
  if (!galleryGroup || !galleryGroup.children.length || !flavorCount ||
      flavorCount !== root.querySelectorAll('.flavor-panel').length ||
      !root.querySelector('.motion') || !root.querySelector('.hero-art') ||
      !root.querySelector('.texture-photo')) return false;

  var galleryCopy = galleryGroup.cloneNode(true);
  galleryCopy.setAttribute('aria-hidden', 'true');
  galleryCopy.querySelectorAll('img').forEach(function (image) { image.alt = ''; });
  galleryGroup.after(galleryCopy);
  initialize(root);
  return true;
}
if (!start()) {
  var observer = new MutationObserver(function () {
    if (start()) observer.disconnect();
  });
  observer.observe(document.documentElement, {childList: true, subtree: true});
  window.setTimeout(function () { observer.disconnect(); }, 20000);
}
})();
</script>

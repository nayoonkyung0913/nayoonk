<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카작 · 스크롤로 두 용량이 모이는 메인</title>
<style>
body{margin:0}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-scroll-scene{height:calc(clamp(640px,100svh,900px) + 80svh);position:relative}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero{position:sticky;top:0;height:clamp(640px,100svh,900px);min-height:0;max-height:none;overflow:clip}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-type{top:6%;font-size:clamp(76px,14cqw,194px)}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero .hero-art{top:23%;left:50%;width:min(76cqw,600px,64svh);aspect-ratio:1.17;translate:none;transform:translateX(-50%);will-change:auto}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero .hero-art > .photo{position:absolute;left:0;bottom:0;width:66%;aspect-ratio:675 / 896;transform:translateX(var(--meet-large-x,0px)) rotate(var(--meet-large-angle,-4deg));transform-origin:50% 90%;will-change:transform}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero .hero-art > .kz-hero-mini{position:absolute;left:46%;bottom:-7%;width:57%;height:auto;max-width:none;transform:translateX(var(--meet-small-x,0px)) rotate(var(--meet-small-angle,3deg));transform-origin:50% 80%;will-change:transform}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-caption{bottom:35px;left:5%;right:5%;text-align:center}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-caption h1{font-size:clamp(24px,2.5cqw,32px);line-height:1.35}
:is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-caption a{margin-top:10px}
@container kz-detail (max-width:700px){
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-type{top:8%;font-size:15cqw}
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero .hero-art{top:29%;width:min(86cqw,440px,64svh)}
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-caption{bottom:30px}
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-caption h1{font-size:24px}
}
@media(prefers-reduced-motion:reduce){
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero-scroll-scene{height:clamp(640px,100svh,900px)}
 :is(#kz-v3,[data-kazak-version])[data-kazak-version="3.0.2"][data-hero-preview] .hero{position:relative}
}
</style>
<main></main>
<script defer src="../../../releases/loader/1.0.0/kazak-loader.js"></script>
<script>
fetch('body.txt').then(r=>{if(!r.ok)throw Error('본문 로딩 실패');return r.text()}).then(html=>{
 const main=document.querySelector('main');main.innerHTML=html;
 const root=main.querySelector('[data-kazak-version]');root.setAttribute('data-hero-preview','meet');
 const hero=root.querySelector('.hero'),art=hero.querySelector('.hero-art');
 art.querySelector('.photo').removeAttribute('style');
 const scene=document.createElement('div');scene.className='hero-scroll-scene';hero.before(scene);scene.append(hero);
 const reduced=matchMedia('(prefers-reduced-motion:reduce)');
 let frame=0;
 function paint(){
  frame=0;
  const rect=scene.getBoundingClientRect(),width=hero.clientWidth,group=art.clientWidth;
  const range=Math.max(1,scene.offsetHeight-hero.offsetHeight);
  const progress=reduced.matches?1:Math.max(0,Math.min(1,-rect.top/(range*.8)));
  const eased=progress*progress*(3-2*progress),remain=1-eased;
  const left=(width-group)/2;
  art.style.setProperty('--meet-large-x',(-(left+group*.66-width*.10)*remain).toFixed(2)+'px');
  art.style.setProperty('--meet-small-x',((width*.90-left-group*.46)*remain).toFixed(2)+'px');
  art.style.setProperty('--meet-large-angle',(-4-6*remain).toFixed(2)+'deg');
  art.style.setProperty('--meet-small-angle',(3+7*remain).toFixed(2)+'deg');
  scene.dataset.progress=progress.toFixed(3);
 }
 function schedule(){if(!frame)frame=requestAnimationFrame(paint)}
 addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule,{passive:true});
 reduced.addEventListener('change',schedule);new ResizeObserver(schedule).observe(hero);paint();
}).catch(()=>{document.querySelector('main').textContent='미리보기를 불러오지 못했습니다.'});
</script>
</html>

var track = root.querySelector('.gallery-track');
var motion = root.querySelector('.motion');
var belt = track && track.querySelector('.gallery-belt');
var galleryGroup = belt && belt.querySelector('.gallery-group');
if (!hero || !art || !photo || !motion || !galleryGroup || !galleryGroup.children.length) return;

if (!belt.querySelector('.gallery-group[aria-hidden="true"]')) {
  var galleryCopy = galleryGroup.cloneNode(true);
  galleryCopy.setAttribute('aria-hidden', 'true');
  galleryCopy.querySelectorAll('img').forEach(function (image) { image.alt = ''; });
  galleryGroup.after(galleryCopy);
}
readyEffects.add(root);
root.classList.add('enhanced');
var paused = media.matches;
var raf = 0;
var recipePhotos = Array.from(root.querySelectorAll("[data-recipe-direction]"));
function paint() {
  raf = 0;
  if (!root.isConnected) {
    window.removeEventListener('scroll', schedule);
    window.removeEventListener('resize', schedule);
    return;
  }
  if (paused) return;
  var height = innerHeight;
  var heroRect = hero.getBoundingClientRect();
  if (heroRect.bottom > 0 && heroRect.top < height) {
    var heroProgress = Math.max(0, Math.min(1, -heroRect.top / heroRect.height));
    art.style.setProperty('--hy', (heroProgress * 70) + 'px');
    art.style.setProperty('--hr', (-7 + heroProgress * 18) + 'deg');
  }
  var textureRect = photo.getBoundingClientRect();
  var progress = Math.max(0, Math.min(1, (height * .95 - textureRect.top) / (height * .60)));
  var ease = progress * (2 - progress);
  photo.style.setProperty('--ts', String(.62 + ease * .46));
  var recipeFrames = recipePhotos.map(function (image) {
    return image.getBoundingClientRect();
  });
  recipePhotos.forEach(function (image, index) {
    var frame = recipeFrames[index];
    var progress = Math.max(0, Math.min(1, (height - frame.top) / (height + frame.height)));
    var direction = Number(image.dataset.recipeDirection);
    var angle = Math.sin(progress * Math.PI * 2) * 20 * direction;
    image.style.setProperty('--kz-recipe-angle', angle.toFixed(2) + 'deg');
  });
}
function schedule(){if(!raf&&!paused)raf=requestAnimationFrame(paint);}window.addEventListener('scroll',schedule,{passive:true});window.addEventListener('resize',schedule,{passive:true});
function sync(){root.classList.toggle('is-paused',paused);motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?'움직임 켜기':'움직임 멈추기';if(paused){art.style.setProperty('--hy','0px');art.style.setProperty('--hr','-7deg');photo.style.setProperty('--ts','1');}else schedule();}motion.addEventListener('click',function(){paused=!paused;sync();});var onMotionChange=function(e){paused=e.matches;sync();};if(media.addEventListener)media.addEventListener('change',onMotionChange);else if(media.addListener)media.addListener(onMotionChange);sync();
var galleryCards = galleryGroup.children;
root.querySelectorAll('[data-slide]').forEach(function (button) {
  button.addEventListener('click', function () {
    var direction = Number(button.dataset.slide);
    var animation = belt.getAnimations ? belt.getAnimations()[0] : null;
    if (!animation || media.matches) {
      track.scrollBy({left: direction * track.clientWidth * .72, behavior: 'auto'});
      return;
    }
    var duration = animation.effect.getTiming().duration;
    animation.currentTime = ((animation.currentTime || 0) + direction * duration / galleryCards.length + duration) % duration;
  });
});
root.addEventListener('click',function(e){var a=e.target.closest('a[href^="#kz-"]');if(!a)return;var t=root.querySelector(a.getAttribute('href'));if(t){e.preventDefault();t.scrollIntoView({behavior:paused?'auto':'smooth',block:'start'});}});
if('IntersectionObserver'in window){var ob=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){if(!paused)e.target.classList.add('enter');ob.unobserve(e.target);}});},{threshold:.15});root.querySelectorAll('.ingredient,.process-grid article,.recipe-card').forEach(function(e){ob.observe(e);});}
}
function initialize(root) {
  initializeFlavors(root);
  initializeEffects(root);
}

var rootSelector = '[id="kz-v3"]';
document.querySelectorAll(rootSelector).forEach(initialize);
// Imweb can insert the mobile copy after the desktop copy is already present.
var observer = new MutationObserver(function (records) {
  var roots = new Set();
  records.forEach(function (record) {
    if (!record.addedNodes.length) return;
    var parentRoot = record.target.closest && record.target.closest(rootSelector);
    if (parentRoot) roots.add(parentRoot);
    record.addedNodes.forEach(function (node) {
      if (node.nodeType !== 1) return;
      if (node.matches(rootSelector)) roots.add(node);
      node.querySelectorAll(rootSelector).forEach(function (root) { roots.add(root); });
    });
  });
  roots.forEach(function (root) { if (root.isConnected) initialize(root); });
});
observer.observe(document.documentElement, {childList: true, subtree: true});
})();
</script>

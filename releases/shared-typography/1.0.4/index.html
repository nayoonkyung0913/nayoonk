<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MINES · 상세페이지 서체 미리보기</title><link rel="stylesheet" href="mines-pretendard.css"><style>
*{box-sizing:border-box}body{margin:0;background:#eceff1;font-family:"MINES Pretendard",sans-serif;color:#171b20}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid #dce1e5;flex-wrap:wrap}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;font-size:14px;padding:9px 13px;min-height:40px;background:#fff;border:1px solid #dce1e5;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#171b20;color:#fff;border-color:#171b20}main{height:calc(100dvh - 70px);overflow:hidden;display:flex;justify-content:center}iframe{width:100%;height:100%;border:0;background:#fff}iframe.mobile{width:390px;max-width:100%}@media(max-width:600px){header{padding:10px;gap:8px}main{height:calc(100dvh - 122px)}button{padding:8px 10px;font-size:13px}}
</style><header><nav aria-label="상품 선택"><button data-page="wetz-drop" aria-pressed="true">웨츠드롭</button><button data-page="kazak" aria-pressed="false">카작</button><button data-page="easy-mayo" aria-pressed="false">이지마요</button><button data-page="crunchbut" aria-pressed="false">크런치벗</button><button data-page="squeeze-peanut" aria-pressed="false">쭉짜먹는 땅콩버터</button></nav><button id="mobile" aria-pressed="false">모바일 폭으로 보기</button></header><main><iframe title="웨츠드롭 상세페이지 미리보기" src="wetz-drop.html"></iframe></main><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.src=button.dataset.page+'.html';frame.title=button.textContent+' 상세페이지 미리보기'});document.querySelector('#mobile').onclick=function(){const mobile=frame.classList.toggle('mobile');this.setAttribute('aria-pressed',String(mobile));this.textContent=mobile?'PC 폭으로 보기':'모바일 폭으로 보기'};
</script></html>
